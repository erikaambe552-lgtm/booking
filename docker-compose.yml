# Optional: PostgreSQL + Redis for local development.  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: campblazer
      POSTGRES_USER: campblazer
      POSTGRES_PASSWORD: campblazer_dev_pw
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  pgdata:
