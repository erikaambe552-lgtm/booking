# Render Blueprint: Dashboard -> New -> Blueprint -> pick this GitHub repo.
# Creates 3 free services. PostgreSQL comes from Neon (free, does not expire);
# paste its DIRECT connection string into DATABASE_URL when Render asks.
services:
  # Django REST API + WebSockets
  - type: web
    name: campblazer-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash render-start.sh
    healthCheckPath: /api/system/info/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL            # Neon direct connection string (postgresql://...sslmode=require)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campblazer-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS    # the frontend address, e.g. https://campblazer.onrender.com
        sync: false
      - key: CSRF_TRUSTED_ORIGINS    # the API address, e.g. https://campblazer-api.onrender.com
        sync: false
      - key: PHOTO_BASE_URL          # the frontend address again (photos are served by the frontend)
        sync: false
      - key: DEMO_PASSWORD           # password for admin_demo / operator_demo / campers (see Environment tab)
        generateValue: true
      - key: GUNICORN_WORKERS        # free instance has 512 MB RAM: 2 workers fit
        value: "2"

  # React + TypeScript frontend (static site, served from a CDN)
  - type: web
    name: campblazer
    runtime: static
    buildFilter:
      paths:
        - frontend/**
        - backend/seed_photos/**
    buildCommand: mkdir -p frontend/public/photos && cp backend/seed_photos/*.jpg frontend/public/photos/ && cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL            # the API address, e.g. https://campblazer-api.onrender.com
        sync: false

  # Redis (Render Key Value) for the Channels layer: carries live events between workers
  - type: keyvalue
    name: campblazer-redis
    plan: free
    region: singapore
    ipAllowList: []                  # internal only: reachable just from campblazer-api
    maxmemoryPolicy: noeviction
