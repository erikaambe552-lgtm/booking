# No persistent disk per the selected profile; SQLite and uploads are ephemeral.
services:
  - type: web
    name: booking-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 4 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/system/info/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_RUNSERVER_WORKERS
        value: "4"
      - key: FRONTEND_URL
        sync: false
      - key: SERVE_MEDIA
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: booking-redis
          property: connectionString

  - type: web
    name: booking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: booking-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru