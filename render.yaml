services:
  - type: keyvalue
    name: campblazer-redis
    plan: free
    ipAllowList: []

  - type: web
    name: campblazer
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: cd backend && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker --workers 4 --bind 0.0.0.0:$PORT --worker-tmp-dir /dev/shm --timeout 120 --graceful-timeout 30 --keep-alive 5
    healthCheckPath: /api/system/info/
    disk:
      name: campblazer-media
      mountPath: /var/data/campblazer
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_RUNSERVER_WORKERS
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: campblazer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: campblazer-redis
          type: keyvalue
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/campblazer/media
      - key: SERVE_MEDIA
        value: "1"

databases:
  - name: campblazer-db
    plan: free
