[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'"
healthcheckPath = "/api/system/info/"
healthcheckTimeout = 120
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10